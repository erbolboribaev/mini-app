<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qaychi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky header (brand + language switch + 3 tabs), then three stacked sections: usta, xizmatlar, bron. */
:root {
  --bg: #EEF0EC;
  --surface: #FFFFFF;
  --fg: #14201C;
  --muted: #5B6862;
  --line: #D3D9D3;
  --accent: #C0322B;
  --accent-fg: #FFFFFF;
  --pole: #2B4C8C;
  --ok: #1F7A4D;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #1A2320; --fg: #ECEFEA; --muted: #98A59E; --line: #2C3833;
    --accent: #E5594F; --accent-fg: #14201C; --pole: #7C9BDB; --ok: #5CC38E; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #1A2320; --fg: #ECEFEA; --muted: #98A59E; --line: #2C3833;
  --accent: #E5594F; --accent-fg: #14201C; --pole: #7C9BDB; --ok: #5CC38E; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding: 0 16px 110px;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; line-height: 1; text-wrap: balance; margin: 0; letter-spacing: 0.01em; text-transform: uppercase; }
p { margin: 0; }
.wrap { max-width: 720px; margin: 0 auto; }

/* header */
.top { position: sticky; top: 0; z-index: 9; background: var(--bg); margin: 0 -16px; padding: 10px 16px 0; }
.top-in { max-width: 720px; margin: 0 auto; display: grid; gap: 6px; padding-bottom: 10px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 26px; text-transform: uppercase; letter-spacing: 0.04em; }
.langs { display: flex; gap: 4px; }
.langs button {
  font: inherit; font-family: var(--font-mono); font-size: 12px; color: var(--fg); background: transparent;
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; cursor: pointer; min-height: 32px;
}
.langs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tabs { display: flex; gap: 4px; margin-left: -12px; }
.tabs a { color: var(--fg); text-decoration: none; font-weight: 500; font-size: 14px; padding: 8px 12px; border-radius: 6px; border: 1px solid transparent; }
.tabs a:hover { border-color: var(--line); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.stripe {
  height: 8px; margin: 0 -16px;
  background: repeating-linear-gradient(-45deg, var(--accent) 0 10px, var(--surface) 10px 20px, var(--pole) 20px 30px, var(--surface) 30px 40px);
  border-block: 1px solid var(--line);
}

section { padding-block: 36px 8px; scroll-margin-top: 110px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }

/* usta */
.hero h1 { font-size: clamp(48px, 13vw, 84px); }
.hero h1 span { color: var(--accent); }
.hero .lead { margin-top: 16px; max-width: 52ch; color: var(--muted); font-size: 17px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 24px; border-block: 1px solid var(--line); }
.facts div { padding: 14px 12px 14px 0; }
.facts div + div { padding-left: 14px; border-left: 1px solid var(--line); }
.facts b { display: block; font-family: var(--font-display); font-size: 34px; font-weight: 800; line-height: 1; }
.facts small { color: var(--muted); font-size: 13px; }
.bio { margin-top: 24px; display: grid; gap: 14px; max-width: 60ch; }
.hours { margin-top: 20px; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }

/* xizmatlar */
h2 { font-size: clamp(34px, 8vw, 48px); }
.svc { list-style: none; margin: 20px 0 0; padding: 0; border-top: 2px solid var(--fg); }
.svc li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.svc .name { font-weight: 600; }
.svc .meta { color: var(--muted); font-size: 14px; }
.svc .price { font-family: var(--font-mono); font-weight: 500; text-align: right; }
.svc .go { grid-column: 2; justify-self: end; }
.link-btn { background: none; border: 0; padding: 4px 0; color: var(--accent); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* bron */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; margin-top: 20px; display: grid; gap: 22px; }
.step-label { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 14px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; cursor: pointer; text-align: left; min-height: 44px; }
.chip small { display: block; color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip[aria-pressed="true"] small { color: var(--bg); opacity: 0.8; }
.chip:disabled { opacity: 0.4; cursor: not-allowed; text-decoration: line-through; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
.slots .chip { text-align: center; font-family: var(--font-mono); padding: 10px 4px; }
.hint { color: var(--muted); font-size: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-weight: 600; font-size: 14px; }
.field input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px; width: 100%; min-height: 46px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.err { color: var(--accent); font-size: 14px; min-height: 20px; }
.summary { border-top: 1px dashed var(--line); padding-top: 16px; display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; justify-content: space-between; }
.summary .sum { min-width: 0; font-size: 15px; }
.summary .sum b { font-family: var(--font-mono); }
.cta { font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 6px; padding: 14px 22px; cursor: pointer; min-height: 48px; }
.tg .cta { display: none; }
.done { display: grid; gap: 14px; }
.done h3 { font-size: 36px; color: var(--ok); }
.done dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; }
.done dt { color: var(--muted); }
.done dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.note { margin-top: 14px; font-size: 13px; color: var(--muted); }
footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="row">
      <div class="brand">Qaychi</div>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="uz" aria-pressed="false">UZ</button>
        <button type="button" data-lang="ru" aria-pressed="false">RU</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <nav class="tabs">
      <a href="#usta" data-i="navUsta"></a>
      <a href="#xizmatlar" data-i="navSvc"></a>
      <a href="#bron" data-i="navBook"></a>
    </nav>
  </div>
  <div class="stripe" aria-hidden="true"></div>
</header>

<main class="wrap">
  <section id="usta" class="hero">
    <div class="eyebrow" data-i="shop"></div>
    <h1><span data-i="h1a" style="color:inherit"></span><br><span data-i="h1b"></span></h1>
    <p class="lead" data-i="lead"></p>
    <div class="facts">
      <div><b>12</b><small data-i="f1"></small></div>
      <div><b>8 000+</b><small data-i="f2"></small></div>
      <div><b>4.9</b><small data-i="f3"></small></div>
    </div>
    <div class="bio">
      <p data-i="bio1"></p>
      <p data-i="bio2"></p>
    </div>
    <p class="hours" data-i="hours"></p>
  </section>

  <section id="xizmatlar">
    <div class="eyebrow" data-i="priceNote"></div>
    <h2 data-i="navSvc"></h2>
    <ul class="svc" id="svcList"></ul>
  </section>

  <section id="bron">
    <div class="eyebrow" data-i="bookEyebrow"></div>
    <h2 data-i="bookTitle"></h2>
    <div class="card" id="bookCard">
      <div>
        <div class="step-label" data-i="step1"></div>
        <div class="hint" data-i="multi" style="margin:-4px 0 10px"></div>
        <div class="chips" id="svcChips"></div>
      </div>
      <div>
        <div class="step-label" data-i="step2"></div>
        <div class="chips" id="dayChips"></div>
      </div>
      <div>
        <div class="step-label" data-i="step3"></div>
        <div class="slots" id="slots"></div>
      </div>
      <div class="fields">
        <div class="field"><label for="nm" data-i="lblName"></label><input id="nm" type="text" autocomplete="name" maxlength="40" data-ph="phName"></div>
        <div class="field"><label for="ph" data-i="lblPhone"></label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="90 123 45 67"></div>
      </div>
      <div class="err" id="err" role="alert"></div>
      <div class="summary">
        <div class="sum" id="sum"></div>
        <button class="cta" id="submit" type="button" data-i="cta"></button>
      </div>
    </div>
    <p class="note" id="demoNote" hidden data-i="demoNote"></p>
  </section>

  <footer><span data-i="footL"></span><span data-i="footR"></span></footer>
</main>

<script>
(function () {

  if (inTg) document.documentElement.classList.add("tg");

      months: ["yan", "fev", "mar", "apr", "may", "iyun", "iyul", "avg", "sen", "okt", "noy", "dek"],

      doneTitle: "Демо: запись готова", dName: "Имя", dSvc: "Услуга", dWhen: "Время", dPrice: "Цена",
      footL: "Барбершоп «Qaychi»", footR: "Чиланзар, Ташкент",
      days: ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"],
      months: ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"],
      svc: { soch: "Стрижка", soqol: "Бритьё бороды", kombo: "Стрижка + борода", bola: "Детская стрижка", yuv: "Мытьё и укладка" }
    },
    en: {
      navUsta: "Barber", navSvc: "Services", navBook: "Book",
      shop: "Barbershop · Tashkent", h1a: "Clean cut.", h1b: "Sharp line.",

      multi: "You can pick several", lblName: "Your name", phName: "e.g. Aziz", lblPhone: "Phone",

      footL: "Qaychi barbershop", footR: "Chilanzar, Tashkent",
      days: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],

      svc: { soch: "Haircut", soqol: "Beard shave", kombo: "Haircut + beard", bola: "Kids' haircut", yuv: "Wash & styling" }
    }
  };

  var SERVICES = [
    { id: "soch", min: 40, price: 60000 },
    { id: "soqol", min: 30, price: 40000 },
    { id: "kombo", min: 60, price: 90000 },
    { id: "bola", min: 30, price: 45000 },
    { id: "yuv", min: 20, price: 25000 }
  ];

  /* ---------- helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function svcById(id) { return SERVICES.filter(function (s) { return s.id === id; })[0]; }
  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  /* ---------- state ---------- */
  var params = new URLSearchParams(location.search);
  var busy = {};
  (params.get("busy") || "").split(",").forEach(function (c) { if (c) busy[c] = true; });

  function pickLang() {
    var cand = [params.get("lang"), safeGet("lang"), tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code];

  var state = { lang: pickLang(), svcs: [], day: null, time: null };

  }
  function dayLabel(i) { return i === 0 ? t("today") : t("days")[days[i].date.getDay()]; }
  function daySub(i) { return days[i].date.getDate() + " " + t("months")[days[i].date.getMonth()]; }

  /* 30-minute cells; a service takes ceil(min/30) cells in a row */
  function totals() {
    var min = 0, price = 0;
    state.svcs.forEach(function (id) { var x = svcById(id); min += x.min; price += x.price; });

    document.documentElement.lang = state.lang;
    Array.prototype.forEach.call(document.querySelectorAll("[data-i]"), function (el) { el.textContent = t(el.getAttribute("data-i")); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-ph]"), function (el) { el.setAttribute("placeholder", t(el.getAttribute("data-ph"))); });
    Array.prototype.forEach.call(document.querySelectorAll(".langs button"), function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === state.lang)); });
    $("demoNote").hidden = inTg;
    if (inTg && tg.MainButton) { try { tg.MainButton.setText(t("cta")); } catch (e) {} }
  }
  function renderLists() {
    $("svcList").innerHTML = SERVICES.map(function (s) {
      return '<li><span class="name">' + esc(t("svc")[s.id]) + '</span><span class="price">' + fmt(s.price) + ' ' + esc(t("cur")) +
        '</span><span class="meta">' + s.min + ' ' + esc(t("min")) + '</span>' +
        '<button class="link-btn go" type="button" data-svc="' + s.id + '">' + esc(t("book")) + '</button></li>';
    }).join("");
    $("svcChips").innerHTML = SERVICES.map(function (s) {
      return '<button class="chip" type="button" data-svc="' + s.id + '" aria-pressed="false">' + esc(t("svc")[s.id]) +
        '<small>' + fmt(s.price) + ' ' + esc(t("cur")) + '</small></button>';
    }).join("");
    $("dayChips").innerHTML = days.map(function (dd, i) {
      return '<button class="chip" type="button" data-day="' + i + '" aria-pressed="false">' + esc(dayLabel(i)) + '<small>' + esc(daySub(i)) + '</small></button>';
    }).join("");
  }
  function renderSlots() {
    var box = $("slots");
    if (state.day === null) { box.innerHTML = '<span class="hint">' + esc(t("pickDay")) + '</span>'; return; }
    var list = slotsFor(state.day);
    if (state.time && !list.some(function (s) { return s.label === state.time && s.free; })) state.time = null;
    if (!list.some(function (s) { return s.free; })) { box.innerHTML = '<span class="hint">' + esc(t("noSlots")) + '</span>'; return; }
    box.innerHTML = list.map(function (s) {
      return '<button class="chip" type="button" data-time="' + s.label + '" aria-pressed="' + (state.time === s.label) + '"' + (s.free ? "" : " disabled") + '>' + s.label + '</button>';
    }).join("");
  }
  function sync() {
    Array.prototype.forEach.call(document.querySelectorAll("#svcChips .chip"), function (b) { b.setAttribute("aria-pressed", String(state.svcs.indexOf(b.getAttribute("data-svc")) !== -1)); });
    Array.prototype.forEach.call(document.querySelectorAll("#dayChips .chip"), function (b) { b.setAttribute("aria-pressed", String(state.day !== null && +b.getAttribute("data-day") === state.day)); });
    renderSlots();
    var el = $("sum");
    if (state.svcs.length) {
      var tt = totals();
      var price = '<b>' + fmt(tt.price) + ' ' + esc(t("cur")) + '</b> · ' + tt.min + ' ' + esc(t("min"));
      if (state.day !== null && state.time) {
        el.innerHTML = esc(svcNames()) + '<br>' + esc(daySub(state.day)) + ' · ' + state.time + '<br>' + price;
      } else {
        el.innerHTML = esc(svcNames()) + '<br>' + price + '<br>' + esc(t("sumSvc"));
      }
    } else {
      el.textContent = t("sumEmpty");
    }
  }
  function renderAll() { applyStatic(); renderLists(); sync(); }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.hasAttribute("data-lang")) {
      state.lang = b.getAttribute("data-lang"); safeSet("lang", state.lang); renderAll();
    } else if (b.hasAttribute("data-svc")) {
      var id = b.getAttribute("data-svc"), at = state.svcs.indexOf(id);
      if (b.classList.contains("go")) {
        if (at === -1) state.svcs.push(id);
      } else if (at === -1) {
        state.svcs.push(id);
      } else {
        state.svcs.splice(at, 1);
      }
      sync();
      if (b.classList.contains("go")) $("bron").scrollIntoView();
    } else if (b.hasAttribute("data-day")) {
      state.day = +b.getAttribute("data-day"); state.time = null; sync();
    } else if (b.hasAttribute("data-time")) {
      state.time = b.getAttribute("data-time"); sync();
    }
  });

  function normalizePhone(digits) {
    if (digits.length === 9) return "+998" + digits;
    return "+" + digits;
  }

  function submit() {
    var name = $("nm").value.trim();
    var digits = $("ph").value.replace(/\D/g, "");
    var err = "";
    if (!state.svcs.length) err = t("errSvc");
    else if (state.day === null) err = t("errDay");
    else if (!state.time) err = t("errTime");
    else if (name.length < 2) err = t("errName");
    else if (digits.length < 9 || digits.length > 15) err = t("errPhone");
    $("err").textContent = err;
    if (err) {
      if (inTg && tg.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred("error"); } catch (e) {} }
      return;
    }
    var payload = { v: 2, svcs: state.svcs.slice(), date: days[state.day].key, time: state.time, name: name, phone: normalizePhone(digits), lang: state.lang };
    if (inTg) {
      try { tg.sendData(JSON.stringify(payload)); } catch (e) { $("err").textContent = String(e); }
      return;
    }
    var tt = totals();
    $("bookCard").innerHTML = '<div class="done"><h3>' + esc(t("doneTitle")) + '</h3><dl>' +
      '<dt>' + esc(t("dName")) + '</dt><dd>' + esc(name) + '</dd>' +
      '<dt>' + esc(t("dSvc")) + '</dt><dd>' + esc(svcNames()) + ' (' + tt.min + ' ' + esc(t("min")) + ')</dd>' +
      '<dt>' + esc(t("dWhen")) + '</dt><dd>' + esc(dayLabel(state.day)) + ', ' + esc(daySub(state.day)) + ', ' + state.time + '</dd>' +
      '<dt>' + esc(t("dPrice")) + '</dt><dd>' + fmt(tt.price) + ' ' + esc(t("cur")) + '</dd></dl></div>';
  }
  $("submit").addEventListener("click", submit);
  if (inTg && tg.MainButton) { try { tg.MainButton.show(); tg.MainButton.onClick(submit); } catch (e) {} }

  var u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u && u.first_name) $("nm").value = u.first_name;

  renderAll();
})();
</script>
</body>
</html>
</html>
